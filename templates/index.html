<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#090d16">
  <title>Agent App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex flex-col h-[100dvh] overflow-hidden select-none">

  <!-- Header -->
  <header class="h-14 border-b border-slate-800 bg-slate-900/80 px-4 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <span class="w-3 h-3 rounded-full bg-emerald-400 animate-ping"></span>
      <h1 class="font-bold tracking-wide text-sm uppercase">AI Agent OS</h1>
    </div>
    <span class="text-[10px] bg-slate-800 border border-slate-700 px-2 py-0.5 rounded text-slate-400">PWA Ready</span>
  </header>

  <!-- Chat Log -->
  <main id="chat-box" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm">
    <div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl max-w-[85%]">
      Namaste! Main aapka autonomous agent hoon. Main calculation, notes save karna aur multi-step planning kar sakta hoon.
    </div>
  </main>

  <!-- Mobile Bottom Action Bar -->
  <footer class="p-3 bg-slate-900/90 border-t border-slate-800">
    <div class="flex gap-2 max-w-lg mx-auto">
      <input id="prompt" type="text" placeholder="Koi task ya sawaal likho..."
             class="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-400">
      <button onclick="send()" class="bg-emerald-500 active:scale-95 text-slate-950 font-bold px-4 rounded-xl">
        Send
      </button>
    </div>
  </footer>

  <script>
    async function send() {
      const input = document.getElementById('prompt');
      const text = input.value.trim();
      if (!text) return;

      const chat = document.getElementById('chat-box');
      chat.innerHTML += `<div class="bg-emerald-600 text-slate-950 font-medium p-3 rounded-2xl ml-auto max-w-[85%]">${text}</div>`;
      input.value = '';
      chat.scrollTop = chat.scrollHeight;

      const loadingId = 'loading-' + Date.now();
      chat.innerHTML += `<div id="${loadingId}" class="bg-slate-900 border border-slate-800 text-slate-400 p-3 rounded-2xl max-w-[85%]">Agent soch raha hai aur tools check kar raha hai...</div>`;
      chat.scrollTop = chat.scrollHeight;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({ message: text })
        });
        const data = await res.json();
        document.getElementById(loadingId).remove();
        chat.innerHTML += `<div class="bg-slate-900 border border-slate-800 p-3 rounded-2xl max-w-[85%]">${data.response}</div>`;
      } catch (err) {
        document.getElementById(loadingId).innerText = "Error: Request fail ho gayi.";
      }
      chat.scrollTop = chat.scrollHeight;
    }
  </script>
</body>
</html>
